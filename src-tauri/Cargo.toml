[package]
name = "pulsebridge"
version = "0.1.2"
description = "Music-reactive fullscreen shader visuals for a second display"
authors = ["PulseBridge contributors"]
edition = "2021"
rust-version = "1.87"

[lib]
name = "pulsebridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
crossbeam-queue = "0.3.12"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
pollster = "1.0.1"
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
uuid = { version = "1.24.1", features = ["serde", "v4"] }
wgpu = { version = "30.0.0", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "wgsl"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.2"
core-foundation = "0.10.1"
coreaudio-sys = { version = "0.2.18", default-features = false, features = ["core_audio"] }
libc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["libc", "NSEvent", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSString", "NSUUID", "NSValue"] }

[profile.release]
debug = 1
strip = "none"

[dev-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in"] }

[features]
default = []
link-integration = []
