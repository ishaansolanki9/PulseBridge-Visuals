name: PulseBridge CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:preview

  native-windows:
    name: Native checks (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Exercise native DX12 pipeline startup
        timeout-minutes: 2
        shell: pwsh
        run: |
          # The preceding cargo test step already built this exact executable.
          # Run it directly to avoid relinking Tauri and static DXC a second time.
          $tests = @(Get-ChildItem src-tauri/target/debug/deps/pulsebridge_lib-*.exe)
          if ($tests.Count -ne 1) { throw "Expected one freshly built native test executable" }
          & ($tests[0].FullName) native_pipeline_startup_audition --ignored --nocapture
          exit $LASTEXITCODE
      - name: Build the native startup smoke application
        run: npm run tauri -- build --debug --no-bundle
      - name: Exercise Windows fullscreen Start and Stop
        timeout-minutes: 4
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - name: Upload native startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PulseBridge-Windows-Startup-Logs
          path: src-tauri/target/windows-startup-smoke
          if-no-files-found: ignore
      - run: npm run tauri -- build --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PulseBridge-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  native-macos:
    name: Native checks (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --bundles app,dmg
      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: PulseBridge-macOS-Unsigned
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
